spring:
  application:
    name: supplier-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SUPPLIER_DATABASE_URL:jdbc:postgresql://localhost:5432/catalog_studio_supplier}
    username: ${SUPPLIER_DATABASE_USER:${DATABASE_USER:catalog_studio}}
    password: ${SUPPLIER_DATABASE_PASSWORD:${DATABASE_PASSWORD:catalog_studio}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:catalogstudio}
    password: ${RABBITMQ_PASSWORD:catalogstudio}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

catalogstudio:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-key-for-catalog-studio-dev-only}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost}
  storage:
    provider: local
    local-path: ${STORAGE_LOCAL_PATH:./uploads-supplier}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8081/api/v1/files}
  upload:
    max-file-bytes: 10485760
    max-images: 5
  platform:
    base-url: ${PLATFORM_BASE_URL:http://localhost:8082}
    internal-api-key: ${INTERNAL_API_KEY:catalog-studio-internal}
  wholesale:
    gst:
      provider: ${WHOLESALE_GST_PROVIDER:mock}
      name-match-threshold: ${WHOLESALE_GST_NAME_MATCH_THRESHOLD:0.72}
      gstinapi-base-url: ${GSTINAPI_BASE_URL:https://www.gstinapi.in}
      gstinapi-api-key: ${GSTINAPI_API_KEY:}
