spring:
  application:
    name: catalog-studio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${ZOHO_MAIL_HOST:smtp.zoho.in}
    port: ${ZOHO_MAIL_PORT:587}
    username: ${ZOHO_MAIL_USERNAME:}
    password: ${ZOHO_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

catalogstudio:
  worker:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-key-for-catalog-studio-dev-only}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:4173}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/v1/files}
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    image-model: ${AI_IMAGE_MODEL:gpt-image-1}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    prompt-path: classpath:prompts/product-analysis.txt
  upload:
    max-images: 5
    max-file-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  security:
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:100}
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@catalogstudio.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@CatalogStudio1}
    demo-seller-email: ${SEED_SELLER_EMAIL:seller@catalogstudio.local}
    demo-seller-password: ${SEED_SELLER_PASSWORD:Seller@CatalogStudio1}
  mail:
    enabled: ${MAIL_ENABLED:true}
    provider: ${MAIL_PROVIDER:zoho}
    host: ${ZOHO_MAIL_HOST:smtp.zoho.in}
    port: ${ZOHO_MAIL_PORT:587}
    username: ${ZOHO_MAIL_USERNAME:}
    password: ${ZOHO_MAIL_PASSWORD:}
    from: ${ZOHO_MAIL_FROM:support@catalogstudio.in}
    from-name: ${ZOHO_MAIL_FROM_NAME:Catalog Studio}
    support-inbox: ${MAIL_SUPPORT_INBOX:support@catalogstudio.in}
    start-tls: ${ZOHO_MAIL_STARTTLS:true}
    zeptomail-api-url: ${ZEPTOMAIL_API_URL:https://api.zeptomail.in/v1.1/email}
    zeptomail-send-token: ${ZEPTOMAIL_SEND_TOKEN:}
  otp:
    enabled: ${OTP_ENABLED:true}
    length: ${OTP_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-seconds: ${OTP_RESEND_SECONDS:60}
    log-code: ${OTP_LOG_CODE:false}
  google:
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  billing:
    whatsapp-number: ${BILLING_WHATSAPP_NUMBER:919560111849}
  tingily:
    base-url: ${TINGILY_BASE_URL:https://engine1.tingily.com}
    email: ${TINGILY_EMAIL:}
    password: ${TINGILY_PASSWORD:}
    token: ${TINGILY_TOKEN:}
    fetch-limit: ${TINGILY_FETCH_LIMIT:40}
  meesho-panel:
    base-url: ${MEESHO_PANEL_BASE_URL:https://supplier.meesho.com}
    live-auth-required: ${MEESHO_PANEL_LIVE_AUTH_REQUIRED:false}
  wholesale:
    gst:
      # mock | gstinapi | http — use gstinapi for production GST verification
      provider: ${WHOLESALE_GST_PROVIDER:mock}
      http-url: ${WHOLESALE_GST_HTTP_URL:}
      http-api-key: ${WHOLESALE_GST_HTTP_API_KEY:}
      name-match-threshold: ${WHOLESALE_GST_NAME_MATCH_THRESHOLD:0.72}
      # gstinapi.in — GET /v1/gstin/{gstin} with x-api-key header
      gstinapi-base-url: ${GSTINAPI_BASE_URL:https://www.gstinapi.in}
      gstinapi-api-key: ${GSTINAPI_API_KEY:}
  # Platform OMS credentials (Base.com-style) — set in .env / .env.gcp, not the browser.
  oms:
    flipkart:
      enabled: ${FLIPKART_OMS_ENABLED:false}
      app-id: ${FLIPKART_APP_ID:}
      app-secret: ${FLIPKART_APP_SECRET:}
      location-id: ${FLIPKART_LOCATION_ID:}
    amazon:
      enabled: ${AMAZON_OMS_ENABLED:false}
      client-id: ${AMAZON_LWA_CLIENT_ID:}
      client-secret: ${AMAZON_LWA_CLIENT_SECRET:}
      refresh-token: ${AMAZON_LWA_REFRESH_TOKEN:}
      marketplace-id: ${AMAZON_MARKETPLACE_ID:A21TJRUUN4KGV}
      sandbox: ${AMAZON_SP_API_SANDBOX:true}
    meesho:
      enabled: ${MEESHO_OMS_ENABLED:false}
      email: ${MEESHO_PANEL_EMAIL:}
      password: ${MEESHO_PANEL_PASSWORD:}
      base-url: ${MEESHO_PANEL_BASE_URL:https://supplier.meesho.com}
      live-auth-required: ${MEESHO_PANEL_LIVE_AUTH_REQUIRED:false}
