spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.catalogstudio: INFO
    org.springframework.security: WARN

catalogstudio:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    api-key: ${AI_API_KEY}
    provider: ${AI_PROVIDER:openai}
  otp:
    log-code: false
  billing:
    whatsapp-number: ${BILLING_WHATSAPP_NUMBER:919560111849}
