version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_studio
      POSTGRES_USER: catalog_studio
      POSTGRES_PASSWORD: catalog_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog_studio_pg:/var/lib/postgresql/data
      - ./scripts/init-supplier-db.sql:/docker-entrypoint-initdb.d/02-supplier-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - catalog_studio_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: catalogstudio
      RABBITMQ_DEFAULT_PASS: catalogstudio
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: .
      dockerfile: catalog-studio-backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/catalog_studio}
      DATABASE_USER: ${DATABASE_USER:-catalog_studio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-catalogstudio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      WHOLESALE_MODULE_ENABLED: ${WHOLESALE_MODULE_ENABLED:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-catalog-studio-internal}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-256-bit-secret-key-for-catalog-studio}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8080}
      STORAGE_LOCAL_PATH: /var/catalog-studio/uploads
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/api/v1/files}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-zoho}
      ZOHO_MAIL_HOST: ${ZOHO_MAIL_HOST:-smtp.zoho.in}
      ZOHO_MAIL_PORT: ${ZOHO_MAIL_PORT:-587}
      ZOHO_MAIL_USERNAME: ${ZOHO_MAIL_USERNAME:-}
      ZOHO_MAIL_PASSWORD: ${ZOHO_MAIL_PASSWORD:-}
      ZOHO_MAIL_FROM: ${ZOHO_MAIL_FROM:-support@catalogstudio.in}
      ZOHO_MAIL_FROM_NAME: ${ZOHO_MAIL_FROM_NAME:-Catalog Studio}
      LOG_DIR: /var/catalog-studio/logs
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - catalog_studio_uploads:/var/catalog-studio/uploads
      - catalog_studio_logs:/var/catalog-studio/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  supplier-service:
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    environment:
      SERVER_PORT: "8081"
      SUPPLIER_DATABASE_URL: ${SUPPLIER_DATABASE_URL:-jdbc:postgresql://postgres:5432/catalog_studio_supplier}
      SUPPLIER_DATABASE_USER: ${SUPPLIER_DATABASE_USER:-catalog_studio}
      SUPPLIER_DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-catalogstudio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://platform-api:8082}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-catalog-studio-internal}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-256-bit-secret-key-for-catalog-studio}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8080}
      STORAGE_LOCAL_PATH: /var/catalog-studio/uploads-supplier
      STORAGE_PUBLIC_BASE_URL: ${SUPPLIER_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/api/v1/supplier-files}
      WHOLESALE_GST_PROVIDER: ${WHOLESALE_GST_PROVIDER:-mock}
      GSTINAPI_API_KEY: ${GSTINAPI_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - catalog_studio_supplier_uploads:/var/catalog-studio/uploads-supplier
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-api:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: gateway/api-gateway/Dockerfile
    environment:
      SERVER_PORT: "8080"
      SUPPLIER_SERVICE_URI: http://supplier-service:8081
      PLATFORM_SERVICE_URI: http://platform-api:8082
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - platform-api
      - supplier-service

  dashboard:
    build:
      context: ./catalog-studio-dashboard
    ports:
      - "80:80"
    depends_on:
      - api-gateway


volumes:
  catalog_studio_pg:
  catalog_studio_uploads:
  catalog_studio_supplier_uploads:
  catalog_studio_logs:
  catalog_studio_redis:
