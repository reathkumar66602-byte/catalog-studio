version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_studio
      POSTGRES_USER: catalog_studio
      POSTGRES_PASSWORD: catalog_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog_studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./catalog-studio-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_studio
      DATABASE_USER: catalog_studio
      DATABASE_PASSWORD: catalog_studio
      JWT_SECRET: change-this-to-a-256-bit-secret-key-for-catalog-studio
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      STORAGE_LOCAL_PATH: /var/catalog-studio/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:8080/api/v1/files
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-zoho}
      ZOHO_MAIL_HOST: ${ZOHO_MAIL_HOST:-smtp.zoho.in}
      ZOHO_MAIL_PORT: ${ZOHO_MAIL_PORT:-587}
      ZOHO_MAIL_USERNAME: ${ZOHO_MAIL_USERNAME:-}
      ZOHO_MAIL_PASSWORD: ${ZOHO_MAIL_PASSWORD:-}
      ZOHO_MAIL_FROM: ${ZOHO_MAIL_FROM:-support@catalogstudio.in}
      ZOHO_MAIL_FROM_NAME: ${ZOHO_MAIL_FROM_NAME:-Catalog Studio}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      ZEPTOMAIL_SEND_TOKEN: ${ZEPTOMAIL_SEND_TOKEN:-}
      OTP_ENABLED: ${OTP_ENABLED:-true}
      OTP_LOG_CODE: ${OTP_LOG_CODE:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      LOG_DIR: /var/catalog-studio/logs
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - catalog_studio_uploads:/var/catalog-studio/uploads
      - catalog_studio_logs:/var/catalog-studio/logs
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./catalog-studio-dashboard
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  catalog_studio_pg:
  catalog_studio_uploads:
  catalog_studio_logs:
