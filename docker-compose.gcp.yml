# Overlay for the GCP VM. Use with docker-compose.yml.
# Postgres is published for pgAdmin; GCP firewall must allow only your home IP.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
    ports: !override
      - "5432:5432"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"

  rabbitmq:
    ports: !override
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-catalogstudio}

  platform-api:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8082"
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_studio
      DATABASE_USER: catalog_studio
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      MESSAGING_ENABLED: "true"
      WHOLESALE_MODULE_ENABLED: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-catalog-studio-internal}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN}/api/v1/files
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-zoho}
      ZOHO_MAIL_HOST: ${ZOHO_MAIL_HOST:-smtppro.zoho.in}
      ZOHO_MAIL_PORT: ${ZOHO_MAIL_PORT:-465}
      ZOHO_MAIL_USERNAME: ${ZOHO_MAIL_USERNAME:-}
      ZOHO_MAIL_PASSWORD: ${ZOHO_MAIL_PASSWORD:-}
      ZOHO_MAIL_FROM: ${ZOHO_MAIL_FROM:-support@catalogstudio.in}
      ZOHO_MAIL_FROM_NAME: ${ZOHO_MAIL_FROM_NAME:-Catalog Studio}
      MAIL_SUPPORT_INBOX: ${MAIL_SUPPORT_INBOX:-support@catalogstudio.in}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      ZEPTOMAIL_SEND_TOKEN: ${ZEPTOMAIL_SEND_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TINGILY_BASE_URL: ${TINGILY_BASE_URL:-https://engine1.tingily.com}
      TINGILY_EMAIL: ${TINGILY_EMAIL:-}
      TINGILY_PASSWORD: ${TINGILY_PASSWORD:-}
      TINGILY_TOKEN: ${TINGILY_TOKEN:-}
      TINGILY_FETCH_LIMIT: ${TINGILY_FETCH_LIMIT:-40}
      FLIPKART_OMS_ENABLED: ${FLIPKART_OMS_ENABLED:-false}
      FLIPKART_APP_ID: ${FLIPKART_APP_ID:-}
      FLIPKART_APP_SECRET: ${FLIPKART_APP_SECRET:-}
      FLIPKART_LOCATION_ID: ${FLIPKART_LOCATION_ID:-}
      AMAZON_OMS_ENABLED: ${AMAZON_OMS_ENABLED:-false}
      AMAZON_LWA_CLIENT_ID: ${AMAZON_LWA_CLIENT_ID:-}
      AMAZON_LWA_CLIENT_SECRET: ${AMAZON_LWA_CLIENT_SECRET:-}
      AMAZON_LWA_REFRESH_TOKEN: ${AMAZON_LWA_REFRESH_TOKEN:-}
      AMAZON_MARKETPLACE_ID: ${AMAZON_MARKETPLACE_ID:-A21TJRUUN4KGV}
      AMAZON_SP_API_SANDBOX: ${AMAZON_SP_API_SANDBOX:-true}
      MEESHO_OMS_ENABLED: ${MEESHO_OMS_ENABLED:-true}
      MEESHO_PANEL_EMAIL: ${MEESHO_PANEL_EMAIL:-}
      MEESHO_PANEL_PASSWORD: ${MEESHO_PANEL_PASSWORD:-}
      MEESHO_PANEL_BASE_URL: ${MEESHO_PANEL_BASE_URL:-https://supplier.meesho.com}
      MEESHO_PANEL_LIVE_AUTH_REQUIRED: ${MEESHO_PANEL_LIVE_AUTH_REQUIRED:-false}
      MEESHO_PREFER_PROPERTY_CREDENTIALS: ${MEESHO_PREFER_PROPERTY_CREDENTIALS:-false}
      MEESHO_AUTO_SYNC_ENABLED: ${MEESHO_AUTO_SYNC_ENABLED:-true}
      MEESHO_ORDER_POLL_MS: ${MEESHO_ORDER_POLL_MS:-300000}
      MEESHO_PUSH_STOCK_ON_CHANGE: ${MEESHO_PUSH_STOCK_ON_CHANGE:-true}
      MEESHO_RESERVE_ON_ORDER_IMPORT: ${MEESHO_RESERVE_ON_ORDER_IMPORT:-true}
      WHOLESALE_GST_PROVIDER: ${WHOLESALE_GST_PROVIDER:-gstinapi}
      WHOLESALE_GST_NAME_MATCH_THRESHOLD: ${WHOLESALE_GST_NAME_MATCH_THRESHOLD:-0.72}
      GSTINAPI_BASE_URL: ${GSTINAPI_BASE_URL:-https://www.gstinapi.in}
      GSTINAPI_API_KEY: ${GSTINAPI_API_KEY:-}
      WHOLESALE_GST_HTTP_URL: ${WHOLESALE_GST_HTTP_URL:-}
      WHOLESALE_GST_HTTP_API_KEY: ${WHOLESALE_GST_HTTP_API_KEY:-}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      DELHIVERY_API_TOKEN: ${DELHIVERY_API_TOKEN:-}
      CASHFREE_ENABLED: ${CASHFREE_ENABLED:-true}
      CASHFREE_ENV: ${CASHFREE_ENV:-PROD}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2023-08-01}
      LOG_DIR: /var/catalog-studio/logs
    volumes:
      - catalog_studio_logs:/var/catalog-studio/logs
    ports: !override
      - "127.0.0.1:8082:8082"

  supplier-service:
    environment:
      SERVER_PORT: "8081"
      SUPPLIER_DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_studio_supplier
      SUPPLIER_DATABASE_USER: catalog_studio
      SUPPLIER_DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      MESSAGING_ENABLED: "true"
      PLATFORM_BASE_URL: http://platform-api:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-catalog-studio-internal}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_LOCAL_PATH: /var/catalog-studio/uploads-supplier
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN}/api/v1/supplier-files
      WHOLESALE_GST_PROVIDER: ${WHOLESALE_GST_PROVIDER:-gstinapi}
      WHOLESALE_GST_NAME_MATCH_THRESHOLD: ${WHOLESALE_GST_NAME_MATCH_THRESHOLD:-0.72}
      GSTINAPI_BASE_URL: ${GSTINAPI_BASE_URL:-https://www.gstinapi.in}
      GSTINAPI_API_KEY: ${GSTINAPI_API_KEY:-}
    ports: !override
      - "127.0.0.1:8081:8081"

  support-service:
    environment:
      SERVER_PORT: "8083"
      SUPPORT_DATABASE_URL: jdbc:postgresql://postgres:5432/catalog_studio_support
      SUPPORT_DATABASE_USER: catalog_studio
      SUPPORT_DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-catalogstudio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-catalogstudio}
      MESSAGING_ENABLED: "true"
      PLATFORM_BASE_URL: http://platform-api:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-catalog-studio-internal}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_LOCAL_PATH: /var/catalog-studio/uploads-support
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SUPPORT_AI_PROVIDER: ${SUPPORT_AI_PROVIDER:-}
      SUPPORT_AI_API_KEY: ${SUPPORT_AI_API_KEY:-}
      SUPPORT_AI_MODEL: ${SUPPORT_AI_MODEL:-}
    ports: !override
      - "127.0.0.1:8083:8083"

  api-gateway:
    environment:
      SERVER_PORT: "8080"
      SUPPLIER_SERVICE_URI: http://supplier-service:8081
      SUPPORT_SERVICE_URI: http://support-service:8083
      PLATFORM_SERVICE_URI: http://platform-api:8082
    ports: !override
      - "127.0.0.1:8080:8080"

  dashboard:
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./catalog-studio-dashboard/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
