# Overlay for the GCP VM. Use with docker-compose.yml.
# Postgres is published for pgAdmin; GCP firewall must allow only your home IP.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
    ports: !override
      - "5432:5432"
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-catalog_studio}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN}/api/v1/files
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-zoho}
      ZOHO_MAIL_HOST: ${ZOHO_MAIL_HOST:-smtppro.zoho.in}
      ZOHO_MAIL_PORT: ${ZOHO_MAIL_PORT:-465}
      ZOHO_MAIL_USERNAME: ${ZOHO_MAIL_USERNAME:-}
      ZOHO_MAIL_PASSWORD: ${ZOHO_MAIL_PASSWORD:-}
      ZOHO_MAIL_FROM: ${ZOHO_MAIL_FROM:-support@catalogstudio.in}
      ZOHO_MAIL_FROM_NAME: ${ZOHO_MAIL_FROM_NAME:-Catalog Studio}
      MAIL_SUPPORT_INBOX: ${MAIL_SUPPORT_INBOX:-support@catalogstudio.in}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      ZEPTOMAIL_SEND_TOKEN: ${ZEPTOMAIL_SEND_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TINGILY_BASE_URL: ${TINGILY_BASE_URL:-https://engine1.tingily.com}
      TINGILY_EMAIL: ${TINGILY_EMAIL:-}
      TINGILY_PASSWORD: ${TINGILY_PASSWORD:-}
      TINGILY_TOKEN: ${TINGILY_TOKEN:-}
      TINGILY_FETCH_LIMIT: ${TINGILY_FETCH_LIMIT:-40}
      FLIPKART_OMS_ENABLED: ${FLIPKART_OMS_ENABLED:-false}
      FLIPKART_APP_ID: ${FLIPKART_APP_ID:-}
      FLIPKART_APP_SECRET: ${FLIPKART_APP_SECRET:-}
      FLIPKART_LOCATION_ID: ${FLIPKART_LOCATION_ID:-}
      AMAZON_OMS_ENABLED: ${AMAZON_OMS_ENABLED:-false}
      AMAZON_LWA_CLIENT_ID: ${AMAZON_LWA_CLIENT_ID:-}
      AMAZON_LWA_CLIENT_SECRET: ${AMAZON_LWA_CLIENT_SECRET:-}
      AMAZON_LWA_REFRESH_TOKEN: ${AMAZON_LWA_REFRESH_TOKEN:-}
      AMAZON_MARKETPLACE_ID: ${AMAZON_MARKETPLACE_ID:-A21TJRUUN4KGV}
      AMAZON_SP_API_SANDBOX: ${AMAZON_SP_API_SANDBOX:-true}
      MEESHO_OMS_ENABLED: ${MEESHO_OMS_ENABLED:-false}
      MEESHO_PANEL_EMAIL: ${MEESHO_PANEL_EMAIL:-}
      MEESHO_PANEL_PASSWORD: ${MEESHO_PANEL_PASSWORD:-}
      MEESHO_PANEL_BASE_URL: ${MEESHO_PANEL_BASE_URL:-https://supplier.meesho.com}
      MEESHO_PANEL_LIVE_AUTH_REQUIRED: ${MEESHO_PANEL_LIVE_AUTH_REQUIRED:-false}
      WHOLESALE_GST_PROVIDER: ${WHOLESALE_GST_PROVIDER:-gstinapi}
      WHOLESALE_GST_NAME_MATCH_THRESHOLD: ${WHOLESALE_GST_NAME_MATCH_THRESHOLD:-0.72}
      GSTINAPI_BASE_URL: ${GSTINAPI_BASE_URL:-https://www.gstinapi.in}
      GSTINAPI_API_KEY: ${GSTINAPI_API_KEY:-}
      WHOLESALE_GST_HTTP_URL: ${WHOLESALE_GST_HTTP_URL:-}
      WHOLESALE_GST_HTTP_API_KEY: ${WHOLESALE_GST_HTTP_API_KEY:-}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      DELHIVERY_API_TOKEN: ${DELHIVERY_API_TOKEN:-}
      LOG_DIR: /var/catalog-studio/logs
    volumes:
      - catalog_studio_logs:/var/catalog-studio/logs
  dashboard:
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
